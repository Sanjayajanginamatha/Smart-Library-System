spring:
  application:
    name: smart-library-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_library
    username: postgres
    password: YOUR_DATABASE_PASSWORD

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: YOUR_EMAIL@gmail.com
    password: YOUR_APP_PASSWORD

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080